<svg width="200" height="52" viewBox="0 0 200 52" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NomosX">
  <rect width="200" height="52" fill="#000000"/>
  <!-- Nu mark (Ν) — three strokes -->
  <line x1="8"  y1="10" x2="8"  y2="42" stroke="white" stroke-width="2.6" stroke-linecap="square"/>
  <line x1="8"  y1="10" x2="34" y2="42" stroke="white" stroke-width="2.6" stroke-linecap="square"/>
  <line x1="34" y1="10" x2="34" y2="42" stroke="white" stroke-width="2.6" stroke-linecap="square"/>
  <!-- Wordmark -->
  <text x="50" y="30" fill="white" font-size="20" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-weight="600" letter-spacing="-0.03em">Nomos<tspan fill="rgba(255,255,255,0.45)">X</tspan></text>
  <text x="51" y="44" fill="rgba(255,255,255,0.25)" font-size="7" font-family="JetBrains Mono, monospace" letter-spacing="0.22em">AUTONOMOUS THINK TANK</text>
</svg>
