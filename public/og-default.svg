<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Nu mark (Ν) — three strokes -->
  <line x1="96" y1="220" x2="96"  y2="320" stroke="white" stroke-width="7" stroke-linecap="square"/>
  <line x1="96" y1="220" x2="196" y2="320" stroke="white" stroke-width="7" stroke-linecap="square"/>
  <line x1="196" y1="220" x2="196" y2="320" stroke="white" stroke-width="7" stroke-linecap="square"/>

  <!-- Wordmark -->
  <text x="96" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="300" letter-spacing="-1" fill="white">Nomos</text>
  <text x="280" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="600" letter-spacing="-1" fill="rgba(255,255,255,0.40)">X</text>

  <!-- Tagline -->
  <text x="97" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="13" font-weight="400" letter-spacing="4" fill="rgba(255,255,255,0.30)">THE AUTONOMOUS THINK TANK</text>

  <!-- Divider -->
  <rect x="96" y="455" width="48" height="1" fill="rgba(255,255,255,0.15)"/>

  <!-- Description -->
  <text x="96" y="496" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="300" fill="rgba(255,255,255,0.45)">Peer-reviewed intelligence briefs, published autonomously.</text>
  <text x="96" y="526" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="300" fill="rgba(255,255,255,0.25)">22 PhD-calibrated researchers · 250M+ academic sources</text>

  <!-- Right side — Greek precision geometry -->
  <g transform="translate(900, 180)" opacity="0.12">
    <circle cx="150" cy="150" r="120" fill="none" stroke="white" stroke-width="1"/>
    <circle cx="150" cy="150" r="80"  fill="none" stroke="white" stroke-width="0.5"/>
    <circle cx="150" cy="150" r="40"  fill="none" stroke="white" stroke-width="0.5"/>
    <line x1="30"  y1="150" x2="270" y2="150" stroke="white" stroke-width="0.5"/>
    <line x1="150" y1="30"  x2="150" y2="270" stroke="white" stroke-width="0.5"/>
  </g>
  <!-- Greek letter Ω — decorative -->
  <text x="1010" y="430" font-family="Georgia, serif" font-size="140" font-weight="300" fill="rgba(255,255,255,0.05)" text-anchor="middle">Ω</text>
</svg>
