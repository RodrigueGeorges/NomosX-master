<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="generator" content="NomosX Agentic Think Tank">
  <title>Provisional Analysis – EU AI Regulation & Competitiveness</title>
  
<style>
  :root {
    --bg: #000000;
    --bg-card: #0a0a0a;
    --bg-elevated: #141414;
    --text: #e4e4e7;
    --text-muted: #a1a1aa;
    --text-dim: #52525b;
    --accent: #ffffff;
    --accent-green: #10B981;
    --accent-red: #F87171;
    --accent-amber: #F59E0B;
    --border: rgba(255,255,255,0.08);
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-serif: 'Merriweather', 'Georgia', serif;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --bg-card: #fafafa;
      --bg-elevated: #f4f4f5;
      --text: #18181b;
      --text-muted: #52525b;
      --text-dim: #71717a;
      --accent: #000000;
      --border: rgba(0,0,0,0.08);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  article.nomosx-brief {
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 32px;
    font-family: var(--font);
    color: var(--text);
    line-height: 1.7;
    background: var(--bg);
  }

  .brief-header {
    margin-bottom: 40px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
  }

  .brief-brand {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 0.75rem;
    margin-bottom: 16px;
    color: var(--text);
  }

  .brief-brand-tag {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 400;
  }

  h1 {
    font-family: var(--font-serif);
    font-size: 2em;
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 16px;
    color: var(--text);
  }

  .metadata-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    align-items: center;
    font-size: 13px;
    color: var(--text-muted);
  }

  .meta-item { padding: 0 4px; }
  .meta-sep { color: var(--text-dim); padding: 0 6px; }

  .key-findings-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    padding: 20px 24px;
    margin: 24px 0 32px;
  }

  .key-findings-card h3 {
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .key-findings-card ul {
    list-style: none;
    padding: 0;
  }

  .key-findings-card li {
    padding: 6px 0 6px 20px;
    position: relative;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
  }

  .key-findings-card li::before {
    content: "→";
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: 700;
  }

  .brief-section {
    margin: 32px 0;
  }

  .brief-section h2 {
    font-family: var(--font);
    font-size: 1.3em;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--accent);
    display: inline-block;
  }

  .brief-section p {
    margin-bottom: 12px;
    font-size: 15px;
    color: var(--text);
  }

  .debate-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin: 16px 0;
  }

  .debate-pro, .debate-con {
    background: var(--bg-card);
    border-radius: 8px;
    padding: 20px;
    border: 1px solid var(--border);
  }

  .debate-pro { border-top: 3px solid var(--accent-green); }
  .debate-con { border-top: 3px solid var(--accent-red); }

  .debate-pro h3 { color: var(--accent-green); font-size: 14px; margin-bottom: 12px; }
  .debate-con h3 { color: var(--accent-red); font-size: 14px; margin-bottom: 12px; }

  .debate-synthesis {
    background: var(--bg-card);
    border-radius: 8px;
    padding: 20px;
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent-amber);
    margin-top: 16px;
  }

  .debate-synthesis h3 { color: var(--accent-amber); font-size: 14px; margin-bottom: 12px; }

  sup.cite a {
    color: var(--accent);
    text-decoration: none;
    font-size: 10px;
    font-weight: 700;
    padding: 0 1px;
  }

  sup.cite a:hover { text-decoration: underline; }

  .references-section {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 2px solid var(--border);
  }

  .references-section h2 {
    font-size: 1.2em;
    margin-bottom: 16px;
    border-bottom: none;
  }

  .apa-ref {
    display: block;
    padding: 8px 0 8px 40px;
    text-indent: -40px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }

  .apa-ref:last-child { border-bottom: none; }

  .ref-num {
    font-weight: 700;
    color: var(--accent);
    min-width: 32px;
    display: inline-block;
  }

  .apa-ref em { color: var(--text); }

  .source-distribution {
    margin: 16px 0;
  }

  .governing-thought {
    background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(16,185,129,0.08));
    border-left: 4px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 14px 18px;
    margin: 0 0 20px;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--text);
  }

  .so-what-callout {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent-green);
    border-radius: 0 8px 8px 0;
    padding: 14px 18px;
    margin: 20px 0 0;
    font-size: 14px;
    color: var(--text-muted);
  }
  .so-what-callout strong { color: var(--accent-green); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }

  .brief-footer {
    margin-top: 48px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }

  @media print {
    article.nomosx-brief { padding: 24px; max-width: 100%; }
    .debate-grid { grid-template-columns: 1fr; }
    sup.cite a { color: #000; }
  }

  @media (max-width: 640px) {
    article.nomosx-brief { padding: 24px 16px; }
    h1 { font-size: 1.5em; }
    .debate-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
