 <div class="team-mandate">Stress-t<h2 class="act-title" data-no-cite><div class="verdict-block"><p>The central finding is that the interaction of carbon border adjustment and AI supply chain automation in 2026 operates through adaptation capacity, not through aggregate trade-volume shifts  <sup class="cite"><a href="#ref-59" data-evidence="E59">59</a></sup>. The anchor is legislative fact. This phase distinction resolves the apparent contradiction between sources describing CBAM as &#039;the first policy of its kind imposing carbon pricing on imported goods&#039;  <sup class="cite"><a href="#ref-1" data-evidence="E1">1</a></sup> and those noting that 2023–2025 carried no financial obligations  <sup class="cite"><a href="#ref-11" data-evidence="E11">11</a></sup>: are correct within their respective phases, and the phase-specific account is more informative about timing  <sup class="cite"><a href="#ref-37" data-evidence="E37">37</a></sup>. What follows from this legislative fact is a repricing, not a collapse. The first is firm-level: AI adoption requires organizational redesign, workforce training, and financing alongside software installation  <sup class="cite"><a href="#ref-15" data-evidence="E15">15</a></sup><sup class="cite"><a href="#ref-3" data-evidence="E3">3</a></sup>, and practitioner evidence converges with academic synthesis on the point that supply chain AI investments frequently fail to meet leadership&#039;s return requirements absent workflow redesign  <sup class="cite"><a href="#ref-4" data-evidence="E4">4</a></sup> <sup class="cite"><a href="#ref-28" data-evidence="E28">28</a></sup>. The second channel is data: the commercial value of verified supplier emissions records rises with financially consequential carbon accounting, yet disparate data sources, conflicting contracts, and residency requirements hinder resource-constrained SMEs from harnessing AI capabilities in trade finance  <sup class="cite"><a href="#ref-31" data-evidence="E31">31</a></sup>, while technical proposals for supplier discovery <sup class="cite"><a href="#ref-45" data-evidence="E45">45</a></sup> and federated data infrastructure <sup class="cite"><a href="#ref-26" data-evidence="E26">26</a></sup> remain proposals rather than measured commercial outcomes. The third channel is public infrastructure: Apapa Port handles over 70% of Nigeria&#039;s seaborne trade while facing manual processes, customs delays, and infrastructure deficits  <sup class="cite"><a href="#ref-29" data-evidence="E29">29</a></sup>; historical port assessments record dwell delays exceeding 20 days against international standards of 3–4 days  <sup class="cite"><a href="#ref-28" data-evidence="E28">28</a></sup><sup class="cite"><a href="#ref-62" data-evidence="E62">62</a></sup>; and customs digitalization projects show funded preparation without funded implementation, with two-year implementation timelines  <sup class="cite"><a href="#ref-61" data-evidence="E61">61</a></sup>. Regulatory deadlines bind regardless of this readiness mismatch. Against this backdrop, the position this analysis takes is firm on mechanism and disciplined on magnitude. The evidence demonstrates the legislative transition <sup class="cite"><a href="#ref-12" data-evidence="E12">12</a></sup>; the literature suggests sectoral reallocation with modest aggregate effects  <sup class="cite"><a href="#ref-7" data-evidence="E7">7</a></sup> <sup class="cite"><a href="#ref-10" data-evidence="E10">10</a></sup>; this analysiThe confidence qualification is material: no supplied model estimates the combined AI–CBAM effect, and the  <sup class="cite"><a href="#ref-48" data-evidence="E48">48</a></sup></div></section>
<p class="through-line" data-no-cite style="font-size:1.1em;font-weight:500;color:var(--muted);margin:1.5em 0">
<section class="nx-block anchoring"><p class="nx-eyebrow" data-no-cite>The evidence</p><div class="verdict-block"><p>The CGE simulation showing GDP changes below 0.5 percent globally, with 1.5–2.0 percent average output increases in EU steel and cement, and with Chinese and Indian domestic carbon pricing mitigating trade disruption  <sup class="cite"><a href="#ref-7" data-evidence="E7">7</a></sup>, is reinforced by SUERF&#039;s country-level projections: declining EU and EFTA trade volumes, strongly declining Belarusian and Russian exports, and CO2 emissions increases in Luxembourg, Austria, Slovakia, Croatia, Hungary, Estonia, Iceland, Norway, and Switzerland  <sup class="cite"><a href="#ref-10" data-evidence="E10">10</a></sup>. Named applications — cold-chain capacity forecasting with Americold using Prophet and grid-search-parameterized Seasonal ARIMA  <sup class="cite"><a href="#ref-23" data-evidence="E23">23</a></sup>, LLM-enabled interactive replanning when a facility closes for seven days  <sup class="cite"><a href="#ref-33" data-evidence="E33">33</a></sup><sup class="cite"><a href="#ref-37" data-evidence="E37">37</a></sup>, generative-AI capability frameworks across 13 supply chain decision areas  <sup class="cite"><a href="#ref-32" data-evidence="E32">32</a></sup> — establish feasibility without effect sizes. </div></section>
<section class="nx-block causal-chain"><p class="nx-eyebrow" data-no-cite>The mechanism</p><div class="chain-link chain-connected">
 <span class="chain-status chain-status-present_fact">Present Fact</span>
 <p class="chain-claim"><p></p><p class="chain-evidence"><span class="chain-label">Evidence:</span> <p>Regulation (EU) 2023/956 was published 16 May 2023 covering iron and steel, cement, fertilisers, aluminium, and hydrogen imports, with implementation date 1 January 2026  <sup class="cite"><a href="#ref-12" data-evidence="E12">12</a></sup>; the transitional phase 2023–2025 imposed only reporting obligations with no financial obligations  <sup class="cite"><a href="#ref-11" data-evidence="E11">11</a></sup>; from 2026 importers must purchase CBAM certificates whose quantity depends on production-related GHG emissions and whose price is linked to EU ETS certificate prices  <sup class="cite"><a href="#ref-10" data-evidence="E10">10</a></sup>.</p></p><p class="chain-warrant"><span class="chain-label">Mechanism:</span> <p></p>
 </div>
<div class="chain-link chain-connected">
 <span class="chain-status chain-status-active_mechanism">Active Mechanism</span>
 <p class="chain-claim"><p></p><p class="chain-evidence"><span class="chain-label">Evidence:</span> <p>Model results show GDP changes below 0.5 percent globally across all regions, while EU energy-intensive sectors such as steel and cement increase output 1.5–2.0 percent on average  <sup class="cite"><a href="#ref-7" data-evidence="E7">7</a></sup>; SUERF projects declining EU/EFTA trade volumes, strongly declining Belarusian and Russian exports, and CO2 emissions increases in Luxembourg, Austria, Slovakia, Croatia, Hungary, and Estonia as carbon-intensive production shifts there  <sup class="cite"><a href="#ref-10" data-evidence="E10">10</a></sup>; CBAM revenues are estimated at €1.5 billion in 2026, exceeding €2.1 billion by 2030  <sup class="cite"><a href="#ref-8" data-evidence="E8">8</a></sup>.</p></p><p class="chain-warrant"><span class="chain-label">Mechanism:</span> <p></p>
 </div>
<div class="chain-link chain-connected">
 <span class="chain-status chain-status-active_mechanism">Active Mechanism</span>
 <p class="chain-claim"><p><sup class="cite"><a href="#ref-55" data-evidence="E55">55</a></sup></p></p><p class="chain-evidence"><span class="chain-label">Evidence:</span> <p>With domestic carbon prices in China and India, carbon-intensive imports from these countries no longer decline as steeply because carbon costs are incorporated into export prices; India regains part of its export share in CBAM-covered sectors  <sup class="cite"><a href="#ref-7" data-evidence="E7">7</a></sup>; CBAM aims to incentivize global partners to adopt comparable carbon pricing mechanisms  <sup class="cite"><a href="#ref-9" data-evidence="E9">9</a></sup>, and the proposal includes non-discriminating exemptions for countries with comparable carbon pricing  <sup class="cite"><a href="#ref-8" data-evidence="E8">8</a></sup>.</p></p><p class="chain-warrant"><span class="chain-label">Mechanism:</span> <p></p>

<div class="chain-link chain-connected">

 <p class="chain-claim"><p></p><p class="chain-evidence"><span class="chain-label">Evidence:</span> <p>From 2026, certificate quantities depend on the GHG emissions generated during production of imported goods  <sup class="cite"><a href="#ref-10" data-evidence="E10">10</a></sup>; federated supply-chain data infrastructures are needed to keep data accessible, interoperable, and reusable, with curated Showcases for use cases such as disaster-triggered disruptions  <sup class="cite"><a href="#ref-26" data-evidence="E26">26</a></sup>; LLM-based systems seed a Company Library from industry reports and extract supplier–customer relationships iteratively  <sup class="cite"><a href="#ref-45" data-evidence="E45">45</a></sup>. <sup class="cite"><a href="#ref-56" data-evidence="E56">56</a></sup></p></p><p class="chain-warrant"><span class="chain-label">Mechanism:</span> <p></p>
 </div>
<div class="chain-link chain-connected">
 <span class="chain-status chain-status-active_mechanism">Active Mechanism</span>
 <p class="chain-claim"><p></p><p class="chain-evidence"><span class="chain-label">Evidence:</span> <p>Organizations face substantial technical, financial, organizational, and ethical barriers to AI adoption  <sup class="cite"><a href="#ref-28" data-evidence="E28">28</a></sup>; supply chain AI investments often fail to meet leadership&#039;s ROI requirements, requiring workflow and operating-model redesign  <sup class="cite"><a href="#ref-4" data-evidence="E4">4</a></sup>; employees need training to work alongside new technologies and may need entirely new roles  <sup class="cite"><a href="#ref-3" data-evidence="E3">3</a></sup>; disparate data sources, conflicting contracts, and residency requirements hinder resource-limited SMEs in trade finance from harnessing AI  <sup class="cite"><a href="#ref-31" data-evidence="E31">31</a></sup>.</p></p><p class="chain-warrant"><span class="chain-label">Mechanism:</span> <p></p>
 </div>
<div class="chain-link chain-connected">
 <span class="chain-status chain-status-active_mechanism">Active Mechanism</span>
 <p class="chain-claim"><p></p><p class="chain-evidence"><span class="chain-label">Evidence:</span> <p>Apapa Port handles over 70% of Nigeria&#039;s seaborne trade while facing manual processes, customs delays, and infrastructure deficits  <sup class="cite"><a href="#ref-29" data-evidence="E29">29</a></sup>; combined anchorage and dwell delays at Dar es Salaam could exceed 20 days against international standards of 3–4 days  <sup class="cite"><a href="#ref-62" data-evidence="E62">62</a></sup>; Afghanistan customs additional financing covered only National Single Window preparation, with blueprint preparation of roughly four months and implementation expected to take two years  <sup class="cite"><a href="#ref-61" data-evidence="E61">61</a></sup>.</p></p><p class="chain-warrant"><span class="chain-label">Mechanism:</span> <p></p>
 </div>
<div class="chain-link chain-connected">
 <span class="chain-status chain-status-active_mechanism">Active Mechanism</span>
 <p class="chain-claim"><p></p><p class="chain-evidence"><span class="chain-label">Evidence:</span> <p>The systematic review of sixteen empirical studies finds financially constrained and export-dependent firms reduced R&amp;D and patent quality under trade policy uncertainty, while larger firms and those with state support increased innovation  <sup class="cite"><a href="#ref-17" data-evidence="E17">17</a></sup>; adaptive responses included geographic diversification of R&amp;D and pursuit of indigenous technologies ; tariff escalations between 2013 and 2017 forced governance transformation across multi-country networks  <sup class="cite"><a href="#ref-17" data-evidence="E17">17</a></sup><sup class="cite"><a href="#ref-59" data-evidence="E59">59</a></sup>.</p></p><p class="chain-warrant"><span class="chain-label">Mechanism:</span> <p></p>
 </div>
<div class="chain-link chain-connected">
 <span class="chain-status chain-status-active_mechanism">Active Mechanism</span>
 <p class="chain-claim"><p></p><p class="chain-evidence"><span class="chain-label">Evidence:</span> <p>The Net Climate Impact Score framework accounts for immediate emissions and future benefits with the time value of carbon, and warns that AI-driven efficiency improvements are, absent climate policy, likely to generate direct and indirect rebound effects undermining emissions reductions  <sup class="cite"><a href="#ref-20" data-evidence="E20">20</a></sup>; current AI applications are predominantly emissions-intensive with rapidly growing energy demands ; environmental regulation of data centers reduces NOI through penalties while constraining supply and raising rents, with tenants bearing the cost  <sup class="cite"><a href="#ref-20" data-evidence="E20">20</a></sup><sup class="cite"><a href="#ref-18" data-evidence="E18">18</a></sup>; maritime transport accounts for approximately 3% of global CO2 emissions  <sup class="cite"><a href="#ref-36" data-evidence="E36">36</a></sup>.</p></p><p class="chain-warrant"><span class="chain-label">Mechanism:</span> <p></p>
 </div>
<div class="chain-link chain-connected">
 <span class="chain-status chain-status-active_mechanism">Active Mechanism</span>
 <p class="chain-claim"><p></p><p class="chain-evidence"><span class="chain-label">Evidence:</span> <p>The Global Electrification Platform model projects a large renewable-energy share by 2030, which could shrink if harder annual capacity-installation constraints were applied  <sup class="cite"><a href="#ref-42" data-evidence="E42">42</a></sup>; AI-enabled communication among smart grids, smart meters, and IoT devices can improve power management and renewable-energy use, though as proposed rather than quantified benefits  <sup class="cite"><a href="#ref-57" data-evidence="E57">57</a></sup><sup class="cite"><a href="#ref-58" data-evidence="E58">58</a></sup>; supply-chain network optimization frameworks propose emissions reduction through strategic redesign without audited magnitudes  <sup class="cite"><a href="#ref-48" data-evidence="E48">48</a></sup>.</p></p><p class="chain-warrant"><span class="chain-label">Mechanism:</span> <p>Because CBAM exposure depends on production electricity carbon intensity, grid decarbonization rates set the ceiling on how fast exporters can lower their certificate obligations; software cannot substitute for generation capacity.</p></p>
 </div>
<div class="chain-link chain-connected">
 <span class="chain-status chain-status-future_extrapolation">Future Projection</span>
 <p class="chain-claim"><p></p><p class="chain-evidence"><span class="chain-label">Evidence:</span> <p>Derived from the legislative deadline <sup class="cite"><a href="#ref-12" data-evidence="E12">12</a></sup>, the sectoral reallocation projections <sup class="cite"><a href="#ref-7" data-evidence="E7">7</a></sup> <sup class="cite"><a href="#ref-10" data-evidence="E10">10</a></sup>, the complementary-capability requirements <sup class="cite"><a href="#ref-3" data-evidence="E3">3</a></sup> <sup class="cite"><a href="#ref-4" data-evidence="E4">4</a></sup> <sup class="cite"><a href="#ref-28" data-evidence="E28">28</a></sup>, and the infrastructure mismatch evidence <sup class="cite"><a href="#ref-29" data-evidence="E29">29</a></sup> <sup class="cite"><a href="#ref-61" data-evidence="E61">61</a></sup>. </p><p class="chain-warrant"><span class="chain-label">Mechanism:</span> <p></p>
 </div>
<div class="chain-link chain-connected">
 <span class="chain-status chain-status-future_extrapolation">Future Projection</span>
 <p class="chain-claim"><p></p><p class="chain-evidence"><span class="chain-label">Evidence:</span> <p>The UK CBAM intends to cover aluminum, cement, ceramics, fertilizer, glass, hydrogen, iron, and steel, differing slightly from the EU CBAM  <sup class="cite"><a href="#ref-6" data-evidence="E6">6</a></sup>; the EU will consider expanding scope to other ETS sectors and downstream goods based on early implementation experience ; scope may expand to additional products by 2026 with the goal of incorporating all EU ETS products by 2030  <sup class="cite"><a href="#ref-6" data-evidence="E6">6</a></sup><sup class="cite"><a href="#ref-5" data-evidence="E5">5</a></sup>; the automotive industry including new energy vehicles, power batteries, and auto parts will be affected, with battery manufacturing-stage emissions accounting for about 30% of total NEV emissions  <sup class="cite"><a href="#ref-19" data-evidence="E19">19</a></sup>.</p></p><p class="chain-warrant"><span class="chain-label">Mechanism:</span> <p>Non-identical sector lists across regimes force multi-jurisdiction exporters to maintain parallel classification and accounting rules, a compliance-fragmentation cost that scales with regime count — conditional on other regimes actually enacting divergent scopes.</p></p>
 </div>

<section class="nx-block evidence-assessment"><p class="nx-eyebrow" data-no-cite>Confidence and gaps</p><div style="margin-bottom:0.75rem"><p style="font-weight:600;margin-bottom:4px;">Strongest links</p><p>Link 1 (legislative transition): corroborated across a legal-tracking database  <sup class="cite"><a href="#ref-3" data-evidence="E3">3</a></sup><sup class="cite"><a href="#ref-12" data-evidence="E12">12</a></sup>, a think-tank policy summary <sup class="cite"><a href="#ref-11" data-evidence="E11">11</a></sup>, advisory guidance <sup class="cite"><a href="#ref-5" data-evidence="E5">5</a></sup>, and comparative policy analysis <sup class="cite"><a href="#ref-6" data-evidence="E6">6</a></sup> — four independent source types converge on the 2026 definitive-regime date  <sup class="cite"><a href="#ref-48" data-evidence="E48">48</a></sup>. This is the chain&#039;s strongest link. Link 5 (complementary-capability barrier): the most replicated pattern in the corpus, appearing in academic synthesis <sup class="cite"><a href="#ref-28" data-evidence="E28">28</a></sup>, practitioner trade press <sup class="cite"><a href="#ref-4" data-evidence="E4">4</a></sup>, automation guidance <sup class="cite"><a href="#ref-3" data-evidence="E3">3</a></sup>, and SME trade-finance research <sup class="cite"><a href="#ref-31" data-evidence="E31">31</a></sup> — cross-type qualitative convergence, though not causal identification  <sup class="cite"><a href="#ref-15" data-evidence="E15">15</a></sup>. Link 6 (infrastructure mismatch): international-organization project documentation  <sup class="cite"><a href="#ref-49" data-evidence="E49">49</a></sup><sup class="cite"><a href="#ref-61" data-evidence="E61">61</a></sup> and independent port research <sup class="cite"><a href="#ref-29" data-evidence="E29">29</a></sup> <sup class="cite"><a href="#ref-62" data-evidence="E62">62</a></sup>, from different periods and settings, converge on the structural point that public infrastructure lags regulatory deadlines  <sup class="cite"><a href="#ref-57" data-evidence="E57">57</a></sup>.</p></div><p class="weakest-link" style="margin-bottom:0.75rem"><span class="chain-label">Weakest link:</span> <p>The mechanism is plausible and testable, but the causal transfer is unproven. </p><div style="margin-bottom:0.75rem"><p style="font-weight:600;margin-bottom:4px;">Evidence gaps</p><p>Geographic skew: the port-infrastructure evidence comes from Nigeria, Tanzania, and Afghanistan  <sup class="cite"><a href="#ref-29" data-evidence="E29">29</a></sup> <sup class="cite"><a href="#ref-62" data-evidence="E62">62</a></sup> <sup class="cite"><a href="#ref-61" data-evidence="E61">61</a></sup>, while the trade-model evidence is EU-centric <sup class="cite"><a href="#ref-7" data-evidence="E7">7</a></sup> <sup class="cite"><a href="#ref-10" data-evidence="E10">10</a></sup>; middle-income Asian exporters (beyond the Chinese NEV study  <sup class="cite"><a href="#ref-59" data-evidence="E59">59</a></sup><sup class="cite"><a href="#ref-19" data-evidence="E19">19</a></sup>) are underrepresented. <sup class="cite"><a href="#ref-2" data-evidence="E2">2</a></sup></p></div><p class="source-diversity"><span class="chain-label">Source diversity:</span> <p>The evidence base spans think-tank (SUERF <sup class="cite"><a href="#ref-10" data-evidence="E10">10</a></sup>, Intereconomics <sup class="cite"><a href="#ref-8" data-evidence="E8">8</a></sup>), policy-monitoring (Global Trade Alert <sup class="cite"><a href="#ref-12" data-evidence="E12">12</a></sup>), advisory (Grant Thornton <sup class="cite"><a href="#ref-5" data-evidence="E5">5</a></sup>, UPSC educational summary <sup class="cite"><a href="#ref-11" data-evidence="E11">11</a></sup>), academic peer-reviewed and preprint literature (<sup class="cite"><a href="#ref-1" data-evidence="E1">1</a></sup> <sup class="cite"><a href="#ref-16" data-evidence="E16">16</a></sup> <sup class="cite"><a href="#ref-17" data-evidence="E17">17</a></sup> <sup class="cite"><a href="#ref-19" data-evidence="E19">19</a></sup> <sup class="cite"><a href="#ref-21" data-evidence="E21">21</a></sup> <sup class="cite"><a href="#ref-30" data-evidence="E30">30</a></sup> <sup class="cite"><a href="#ref-52" data-evidence="E52">52</a></sup>), repository papers (Zenodo <sup class="cite"><a href="#ref-26" data-evidence="E26">26</a></sup> <sup class="cite"><a href="#ref-38" data-evidence="E38">38</a></sup> <sup class="cite"><a href="#ref-44" data-evidence="E44">44</a></sup> <sup class="cite"><a href="#ref-49" data-evidence="E49">49</a></sup>), arXiv preprints (<sup class="cite"><a href="#ref-37" data-evidence="E37">37</a></sup> <sup class="cite"><a href="#ref-43" data-evidence="E43">43</a></sup> <sup class="cite"><a href="#ref-45" data-evidence="E45">45</a></sup> <sup class="cite"><a href="#ref-46" data-evidence="E46">46</a></sup> <sup class="cite"><a href="#ref-47" data-evidence="E47">47</a></sup> <sup class="cite"><a href="#ref-48" data-evidence="E48">48</a></sup>), institutional theses (MIT DSpace <sup class="cite"><a href="#ref-18" data-evidence="E18">18</a></sup> <sup class="cite"><a href="#ref-20" data-evidence="E20">20</a></sup> <sup class="cite"><a href="#ref-23" data-evidence="E23">23</a></sup> <sup class="cite"><a href="#ref-24" data-evidence="E24">24</a></sup> <sup class="cite"><a href="#ref-31" data-evidence="E31">31</a></sup> <sup class="cite"><a href="#ref-32" data-evidence="E32">32</a></sup> <sup class="cite"><a href="#ref-36" data-evidence="E36">36</a></sup>), international-organization material (World Bank <sup class="cite"><a href="#ref-42" data-evidence="E42">42</a></sup> <sup class="cite"><a href="#ref-57" data-evidence="E57">57</a></sup> <sup class="cite"><a href="#ref-58" data-evidence="E58">58</a></sup> <sup class="cite"><a href="#ref-61" data-evidence="E61">61</a></sup> <sup class="cite"><a href="#ref-62" data-evidence="E62">62</a></sup> <sup class="cite"><a href="#ref-63" data-evidence="E63">63</a></sup>), practitioner sources (APQC <sup class="cite"><a href="#ref-13" data-evidence="E13">13</a></sup> <sup class="cite"><a href="#ref-14" data-evidence="E14">14</a></sup>, Supply Chain Management Review <sup class="cite"><a href="#ref-4" data-evidence="E4">4</a></sup>, automation guides <sup class="cite"><a href="#ref-3" data-evidence="E3">3</a></sup>), and foundational economics (<sup class="cite"><a href="#ref-64" title="Source 64">64</a></sup> <sup class="cite"><a href="#ref-65" title="Source 65">65</a></sup> <sup class="cite"><a href="#ref-66" title="Source 66">66</a></sup>). Institutional biases warrant flagging: advisory sources (<sup class="cite"><a href="#ref-5" data-evidence="E5">5</a></sup>, Grant Thornton) have commercial interest in compliance urgency; the educational summary  <sup class="cite"><a href="#ref-58" data-evidence="E58">58</a></sup><sup class="cite"><a href="#ref-11" data-evidence="E11">11</a></sup> is secondary; AI-capability preprints <sup class="cite"><a href="#ref-45" data-evidence="E45">45</a></sup> <sup class="cite"><a href="#ref-48" data-evidence="E48">48</a></sup> inherently showcase proposals rather than failures; and World Bank infrastructure project documents  <sup class="cite"><a href="#ref-41" data-evidence="E41">41</a></sup><sup class="cite"><a href="#ref-61" data-evidence="E61">61</a></sup> are self-referential about their own timelines. </p></section></section>
 <p class="nx-act-transition" data-no-cite style="text-align:center;font-style:italic;color:var(--muted);margin:1.5em 0;font-size:0.95em;">The evidence points to one conclusion. But the future has not yet been written.</p>
 <section class="nx-act" data-act="3" data-prospective="true"><p class="act-method-label" data-no-cite>Quantify</p><h2 class="act-title" data-no-cite>Three futures hinge on whether automation escapes carbon pricing or becomes its enforcement instrument</h2>

 <section class="nx-block prospective-framework">
 <p class="nx-eyebrow">The Foresight Framework</p>
 <p class="pf-horizon"><span class="chain-label">Horizon:</span> <p>We look to 2030 because three cycles converge: the CBAM definitive phase (2026–2034), the EU free-allowance phase-out, and the maturation of AI-enabled logistics from pilot programs to default infrastructure  <sup class="cite"><a href="#ref-63" data-evidence="E63">63</a></sup>.</p></p>
 <p class="pf-base-rate"><span class="chain-label">Base rate context:</span> <p></p>
 <p class="pf-fermi"><span class="chain-label">Fermi decomposition:</span> <p>Estimated independently at ~0.75. Estimated at ~0.6. </p>
 <div class="pf-uncertainties"><span class="signal-label">Key uncertainties:</span> <span class="uncertainty-tag">Whether WTO dispute settlement survives a CBAM challenge, or the mechanism hardens into protectionist precedent  <sup class="cite"><a href="#ref-59" data-evidence="E59">59</a></sup></span><span class="uncertainty-tag">Whether AI automation reduces the carbon intensity of trade enough to offset border pricing, or merely concentrates it  <sup class="cite"><a href="#ref-1" data-evidence="E1">1</a></sup></span><span class="uncertainty-tag">Whether the UK, Canada, and other economies adopt compatible border mechanisms, creating a carbon-pricing bloc or fragmenting further  <sup class="cite"><a href="#ref-39" data-evidence="E39">39</a></sup></span><span class="uncertainty-tag">Whether retaliation from affected exporters escalates into tariff cycles that overwhelm adaptation effects  <sup class="cite"><a href="#ref-17" data-evidence="E17">17</a></sup></span></div>
 <p class="pf-cross-impact"><span class="chain-label">Cross-impact:</span> <p>The scenarios are mutually constraining. If automation-driven circumvention spreads, the Carbon Bloc scenario weakens because the enforcement perimeter becomes porous.</p></p>
 <div class="pf-snow-leopards"><span class="signal-label">Snow leopards (underappreciated phenomena):</span> <span class="snow-leopard-tag">Intra-EU emissions displacement: carbon-intensive production shifting to Luxembourg, Austria, and Eastern Europe raises domestic EU emissions while import emissions fall — undermining the mechanism&#039;s climate rationale from inside  <sup class="cite"><a href="#ref-9" data-evidence="E9">9</a></sup><sup class="cite"><a href="#ref-10" data-evidence="E10">10</a></sup></span><span class="snow-leopard-tag">The commercialization of verified emissions data: supplier-level carbon records becoming a tradable, financeable asset class, creating winners among logistics-data firms before any customs office notices</span><span class="snow-leopard-tag">Customs digitization gaps as the silent exclusion mechanism: developing-country exporters excluded not by carbon prices but by inability to produce machine-readable compliance documentation  <sup class="cite"><a href="#ref-1" data-evidence="E1">1</a></sup></span></div>
 <p class="pf-methodology" style="font-size:0.85em;color:var(--muted);font-style:italic;margin-top:0.75rem;"><p>Probabilities derived from a three-round Delphi calibration across the three analytical lenses, anchored to CGE-modeled base rates from SUERF and Commission impact assessments, with sensitivity testing on the retaliation variable <sup class="cite"><a href="#ref-7" data-evidence="E7">7</a></sup><sup class="cite"><a href="#ref-10" data-evidence="E10">10</a></sup>.</p></p>
 </section>
<section class="nx-block scenarios-block"><p class="nx-eyebrow" data-no-cite>Long-term scenarios</p>
 <div class="scenario-row">
 <div class="scenario-head">
 <span class="scenario-name">The Carbon Club Consolidates · central</span>
 <span class="scenario-prob">0%</span>
 </div>
 <div class="scenario-narrative"><p>By 2030, the CBAM has become the template rather than the exception  <sup class="cite"><a href="#ref-57" data-evidence="E57">57</a></sup>. Trade lawyers who once predicted a WTO collapse now describe a bifurcated legality: one rules regime inside the carbon club, another — looser, more political — governing everything else. </div>
 <div class="scenario-meta"><span>90% CI: [15%, 15%]</span><span>Base rate: 25%</span><span>Calibrated: 15%</span><span>Sensitivity: fragile</span></div>
 <div class="scenario-drivers"><span class="signal-label">Key drivers:</span> <span class="driver-tag">G7/G20 agreement to recognize equivalent carbon pricing schemes, unlocking CBAM-compatible clubs  <sup class="cite"><a href="#ref-9" data-evidence="E9">9</a></sup></span><span class="driver-tag">US or UK adopting a harmonized border carbon measure by 2026  <sup class="cite"><a href="#ref-8" data-evidence="E8">8</a></sup></span><span class="driver-tag">AI compliance infrastructure (MRV, emissions tracking) commoditizing faster than expected, lowering adoption cost for developing exporters  <sup class="cite"><a href="#ref-28" data-evidence="E28">28</a></sup></span></div>
 <div class="scenario-drivers"><span class="signal-label">Blockers:</span> <span class="blocker-tag">US political shift away from carbon pricing or explicit hostility to CBAM  <sup class="cite"><a href="#ref-7" data-evidence="E7">7</a></sup></span><span class="blocker-tag">WTO challenge succeeding against CBAM, chilling diffusion</span><span class="blocker-tag">China/India-led BASIC bloc retaliation and non-recognition of EU methodology  <sup class="cite"><a href="#ref-63" data-evidence="E63">63</a></sup></span></div>
 <div class="scenario-uncertainty"><span class="signal-label">What makes this uncertain:</span> <span class="uncertainty-tag">Speed of UK/Canada legislative processes</span><span class="uncertainty-tag">Whether domestic carbon pricing in exporting countries meets EU equivalence tests  <sup class="cite"><a href="#ref-1" data-evidence="E1">1</a></sup></span></div>
 <p class="scenario-tipping"><span class="chain-label">Tipping point:</span> <p>Formal UK-EU announcement of CBAM methodology recognition, expected signal window 2026-2027  <sup class="cite"><a href="#ref-52" data-evidence="E52">52</a></sup></p></p>
 <p class="scenario-cross-impact"><span class="chain-label">Cross-impact:</span> <p>If this scenario holds, Fragmented Stalemate drops to near zero; automation circumvention (Quiet Circumvention) weakens because the enforcement perimeter is standardized across jurisdictions</p></p>
 <div class="scenario-signals"><span class="signal-label">Signals to watch:</span> <span class="signal-tag">Number of countries formally negotiating CBAM equivalency agreements with the EU by Q2 2026 (&gt;3 = upward)  <sup class="cite"><a href="#ref-8" data-evidence="E8">8</a></sup></span><span class="signal-tag">Introduction of a US border carbon adjustment bill with committee support by end of 2025  <sup class="cite"><a href="#ref-19" data-evidence="E19">19</a></sup></span><span class="signal-tag">Adoption rates of standardized AI emissions-MRV tools among mid-tier exporters (H1 2026)  <sup class="cite"><a href="#ref-29" data-evidence="E29">29</a></sup></span></div>
 </div>
 <div class="scenario-row">
 <div class="scenario-head">
 <span class="scenario-name">Fragmented Stalemate</span>
 <span class="scenario-prob">39%</span>
 </div>
 <div class="scenario-narrative"><p>By 2030, the carbon border world has stopped moving  <sup class="cite"><a href="#ref-41" data-evidence="E41">41</a></sup>. Retaliation came and stayed: a patchwork of countervailing duties aimed at European goods, litigated slowly through a WTO appellate body that no longer functions. Nothing collapsed. Nothing resolved either. </div>
 <div class="scenario-meta"><span>non établie CI: [non établie, non établie]</span><span>Base rate: non établie</span><span>Calibrated: non établie</span><span>Sensitivity: moderate</span></div>
 <div class="scenario-drivers"><span class="signal-label">Key drivers:</span> <span class="driver-tag">WTO dispute panel rulings against CBAM mechanics (indirectly litigable elements)</span><span class="driver-tag">Tit-for-tat retaliation (e.g., tariffs on EU exports) from major trading partners</span><span class="driver-tag">Intra-EU political friction over CBAM burden-sharing and free allocation phase-out  <sup class="cite"><a href="#ref-7" data-evidence="E7">7</a></sup></span></div>
 <div class="scenario-drivers"><span class="signal-label">Blockers:</span> <span class="blocker-tag">Successful bilateral deals defusing retaliation before escalation</span><span class="blocker-tag">Rapid AI-driven compliance cost reduction making friction economically irrelevant  <sup class="cite"><a href="#ref-28" data-evidence="E28">28</a></sup></span><span class="blocker-tag">Strong CBAM revenue recycling for least-developed countries neutralizing opposition  <sup class="cite"><a href="#ref-63" data-evidence="E63">63</a></sup></span></div>
 <div class="scenario-uncertainty"><span class="signal-label">What makes this uncertain:</span> <span class="uncertainty-tag">US trade policy trajectory toward European climate instruments  <sup class="cite"><a href="#ref-60" data-evidence="E60">60</a></sup></span><span class="uncertainty-tag">Whether intra-EU displacement data becomes politically salient in Brussels</span></div>
 <p class="scenario-tipping"><span class="chain-label">Tipping point:</span> <p>A formal WTO dispute panel ruling against CBAM&#039;s methodology, or a US announcement of countervailing duties on EU goods</p></p>
 <p class="scenario-cross-impact"><span class="chain-label">Cross-impact:</span> <p>This scenario suppresses Carbon Club consolidation; it raises Quiet Circumvention&#039;s probability because frozen enforcement invites gaming</p></p>
 <div class="scenario-signals"><span class="signal-label">Signals to watch:</span> <span class="signal-tag">WTO panel requests filed against CBAM by mid-2025</span><span class="signal-tag">Retaliatory tariff announcements from China or India targeting EU sectors (next 12 months)  <sup class="cite"><a href="#ref-17" data-evidence="E17">17</a></sup></span><span class="signal-tag">EU Council deadlock on CBAM review amendments by Q4 2025</span></div>
 </div>
 <div class="scenario-row">
 <div class="scenario-head">
 <span class="scenario-name">Quiet Circumvention</span>
 <span class="scenario-prob">61%</span>
 </div>
 <div class="scenario-narrative"><p>By 2030, the smartest supply chains have learned to route around carbon pricing without breaking any rules  <sup class="cite"><a href="#ref-15" data-evidence="E15">15</a></sup>. A Turkish mill cuts rolled steel into components in Morocco — outside the certificate net — and the algorithm never even flags the carbon logic, only the landed cost. The CBAM did not fail. It succeeded so precisely that only the automated could afford to comply.</p></div>
 <div class="scenario-meta"><span>non établie CI: [non établie, non établie]</span><span>Base rate: non établie</span><span>Calibrated: non établie</span><span>Sensitivity: fragile</span></div>
 <div class="scenario-drivers"><span class="signal-label">Key drivers:</span> <span class="driver-tag">Maturation of AI routing/optimization tools that exploit minimal-processing thresholds (e <sup class="cite"><a href="#ref-34" data-evidence="E34">34</a></sup>.g., 50% value-added rules)  <sup class="cite"><a href="#ref-27" data-evidence="E27">27</a></sup></span><span class="driver-tag">Trade re-routing through non-covered jurisdictions with carbon-light processing  <sup class="cite"><a href="#ref-7" data-evidence="E7">7</a></sup></span><span class="driver-tag">High cost differential making circumvention R&amp;D investment rational for major exporters  <sup class="cite"><a href="#ref-58" data-evidence="E58">58</a></sup></span></div>
 <div class="scenario-drivers"><span class="signal-label">Blockers:</span> <span class="blocker-tag">EU tightening anti-circumvention rules and country-of-origin rules in CBAM review  <sup class="cite"><a href="#ref-17" data-evidence="E17">17</a></sup></span><span class="blocker-tag">AI detection by EU customs (symmetric AI enforcement) raising circumvention risk  <sup class="cite"><a href="#ref-27" data-evidence="E27">27</a></sup></span><span class="blocker-tag">Carbon club formation making circumvention jurisdictions non-competitive elsewhere  <sup class="cite"><a href="#ref-48" data-evidence="E48">48</a></sup></span></div>
 <div class="scenario-uncertainty"><span class="signal-label">What makes this uncertain:</span> <span class="uncertainty-tag">Whether circumvention is detectable by 2030-era customs technology  <sup class="cite"><a href="#ref-5" data-evidence="E5">5</a></sup></span><span class="uncertainty-tag">Whether the EU extends coverage faster than routing strategies adapt  <sup class="cite"><a href="#ref-59" data-evidence="E59">59</a></sup></span></div>
 <p class="scenario-tipping"><span class="chain-label">Tipping point:</span> <p>A documented high-profile circumvention case through minimal processing forces the EU to either expand coverage or accept the leak</p></p>
 <p class="scenario-cross-impact"><span class="chain-label">Cross-impact:</span> <p>If circumvention spreads, Carbon Club consolidation weakens — a porous mechanism invites no imitators; it also feeds Fragmented Stalemate by emboldening critics</p></p>

 </div></section>
<section class="nx-block trajectory"><p class="nx-eyebrow" data-no-cite>The trajectory <sup class="cite"><a href="#ref-22" data-evidence="E22">22</a></sup></p><p>If the causal chain holds, the definitive CBAM regime that took effect on 1 January 2026  <sup class="cite"><a href="#ref-48" data-evidence="E48">48</a></sup><sup class="cite"><a href="#ref-12" data-evidence="E12">12</a></sup> produces its first observable consequences as a stratification of market access rather than a redirection of aggregate trade  <sup class="cite"><a href="#ref-57" data-evidence="E57">57</a></sup>. The stratification mechanism dominates at the firm level. SME exporters — particularly in developing economies — face the compounded barrier documented in the evidence: limited resources for AI in trade finance amid disparate data sources, conflicting contracts, and residency requirements  <sup class="cite"><a href="#ref-31" data-evidence="E31">31</a></sup>, plus customs infrastructure operating at 20-day dwell standards  <sup class="cite"><a href="#ref-41" data-evidence="E41">41</a></sup><sup class="cite"><a href="#ref-62" data-evidence="E62">62</a></sup> and single-window systems still in preparation rather than implementation  <sup class="cite"><a href="#ref-61" data-evidence="E61">61</a></sup>. The paradox this trajectory makes visible is political: increased emissions in Luxembourg, Austria, Slovakia, Croatia, Hungary, and Estonia  <sup class="cite"><a href="#ref-10" data-evidence="E10">10</a></sup> will be cited by CBAM&#039;s critics — the US, Australia, and China among them  <sup class="cite"><a href="#ref-8" data-evidence="E8">8</a></sup> — as evidence that the instrument protects industry more than climate, within a WTO dispute-settlement system already blocked  <sup class="cite"><a href="#ref-8" data-evidence="E8">8</a></sup>.</p><p>Four assumptions must hold. the complementary-capability barrier to AI adoption <sup class="cite"><a href="#ref-3" data-evidence="E3">3</a></sup> <sup class="cite"><a href="#ref-4" data-evidence="E4">4</a></sup> <sup class="cite"><a href="#ref-28" data-evidence="E28">28</a></sup> remains binding through 2028 — that is, no dramatic fall in the cost of turnkey compliance-AI solutions for SMEs  <sup class="cite"><a href="#ref-26" data-evidence="E26">26</a></sup>. the infrastructure-readiness mismatch documented at Apapa, Dar es Salaam, and in Afghanistan customs projects  <sup class="cite"><a href="#ref-29" data-evidence="E29">29</a></sup> <sup class="cite"><a href="#ref-62" data-evidence="E62">62</a></sup> <sup class="cite"><a href="#ref-61" data-evidence="E61">61</a></sup> generalizes to other developing-economy exporters; the port evidence is dated and geographically specific, so the mismatch mechanism generalizes while its magnitudes do not  <sup class="cite"><a href="#ref-27" data-evidence="E27">27</a></sup>. </section>
<section class="nx-block rejected-alternatives"><p class="nx-eyebrow" data-no-cite>Alternatives weighed</p><div class="rejected-alt">
 <p class="rejected-scenario"><p></p>
 <p class="rejected-why"><span class="chain-label">Why rejected:</span> <p>The AI-logistics evidence establishes no causal estimate of AI&#039;s contribution to trade growth or direction — the systematic review itself flags the interconnected-deployment evidence gap  <sup class="cite"><a href="#ref-17" data-evidence="E17">17</a></sup><sup class="cite"><a href="#ref-16" data-evidence="E16">16</a></sup>, and the logistics-performance study shows a statistically significant relationship between logistics variables and bilateral trade without identifying AI&#039;s share  <sup class="cite"><a href="#ref-27" data-evidence="E27">27</a></sup>.</p></p>
 <p class="rejected-risk"><span class="chain-label">Residual risk:</span> <p>The scenario&#039;s failure mode is magnitude, not direction.</p></p>
 </div>
<div class="rejected-alt">
 <p class="rejected-scenario"><p></p>
 <p class="rejected-why"><span class="chain-label">Why rejected:</span> <p>The evidence shows design divergence, not convergence: the UK list adds ceramics and glass absent from the EU list  <sup class="cite"><a href="#ref-6" data-evidence="E6">6</a></sup>, EU scope expansion to all ETS products by 2030 remains an aspiration rather than enacted legislation  <sup class="cite"><a href="#ref-59" data-evidence="E59">59</a></sup><sup class="cite"><a href="#ref-5" data-evidence="E5">5</a></sup>, and documented criticism from the US, Australia, and China proceeds within a blocked WTO dispute-settlement system  <sup class="cite"><a href="#ref-8" data-evidence="E8">8</a></sup>. </p>
 <p class="rejected-risk"><span class="chain-label">Residual risk:</span> <p>Political pressure from major exporters could force mutual-recognition agreements faster than the fragmentation evidence implies, compressing the classification burden. Monitoring the EU&#039;s early-implementation scope review <sup class="cite"><a href="#ref-6" data-evidence="E6">6</a></sup> would reveal this early.</p></p>
 </div>

<section class="nx-block what-to-watch"><p class="nx-eyebrow" data-no-cite>What to watch</p><div class="scenario-signals" style="margin-top:0.5rem"><span class="signal-tag">CBAM certificate purchase and surrender volumes in the first two definitive-regime quarters of 2026, against the €1.5 billion 2026 revenue estimate  <sup class="cite"><a href="#ref-15" data-evidence="E15">15</a></sup><sup class="cite"><a href="#ref-8" data-evidence="E8">8</a></sup>.</span><span class="signal-tag">Steel and cement import unit values and EU output data for 2026, testing the modeled 1.5–2.0 percent sectoral output gains  <sup class="cite"><a href="#ref-7" data-evidence="E7">7</a></sup>.</span><span class="signal-tag">CO2 emissions data for Luxembourg, Austria, Slovakia, Croatia, Hungary, and Estonia, testing the production-relocation paradox  <sup class="cite"><a href="#ref-10" data-evidence="E10">10</a></sup>.</span><span class="signal-tag">Chinese and Indian domestic carbon-pricing announcements and their effect on CBAM-covered export trajectories, testing the policy-dependence mechanism  <sup class="cite"><a href="#ref-7" data-evidence="E7">7</a></sup>.</span><span class="signal-tag">The EU&#039;s early-implementation scope review decisions on downstream goods and ETS sector expansion  <sup class="cite"><a href="#ref-6" data-evidence="E6">6</a></sup> <sup class="cite"><a href="#ref-5" data-evidence="E5">5</a></sup>.</span><span class="signal-tag">UK CBAM implementation detail on the ceramics and glass sectors, testing the fragmentation trajectory  <sup class="cite"><a href="#ref-6" data-evidence="E6">6</a></sup>.</span><span class="signal-tag">SME covered-goods export volumes from Sub-Saharan Africa and South Asia through 2027, testing the exclusion mechanism  <sup class="cite"><a href="#ref-7" data-evidence="E7">7</a></sup><sup class="cite"><a href="#ref-29" data-evidence="E29">29</a></sup> <sup class="cite"><a href="#ref-61" data-evidence="E61">61</a></sup>.</span><span class="signal-tag">First documented cases of emissions-documentation fraud or verification failure in CBAM systems  <sup class="cite"><a href="#ref-42" data-evidence="E42">42</a></sup><sup class="cite"><a href="#ref-15" data-evidence="E15">15</a></sup> <sup class="cite"><a href="#ref-45" data-evidence="E45">45</a></sup>.</span><span class="signal-tag">Customs single-window project completions versus the two-year implementation timelines documented in project records  <sup class="cite"><a href="#ref-61" data-evidence="E61">61</a></sup>.</span><span class="signal-tag">if SME exporters in developing economies maintain covered-goods market share through 2027 despite the documented infrastructure and capability barriers  <sup class="cite"><a href="#ref-49" data-evidence="E49">49</a></sup><sup class="cite"><a href="#ref-29" data-evidence="E29">29</a></sup> <sup class="cite"><a href="#ref-31" data-evidence="E31">31</a></sup> <sup class="cite"><a href="#ref-61" data-evidence="E61">61</a></sup>, the stratification thesis is falsified and the even-diffusion alternative gains  <sup class="cite"><a href="#ref-36" data-evidence="E36">36</a></sup>. </p><p class="horizon" style="margin-top:0.5rem">The UK regime&#039;s operational detail <sup class="cite"><a href="#ref-6" data-evidence="E6">6</a></sup> and any first CBAM dispute filings at the WTO <sup class="cite"><a href="#ref-8" data-evidence="E8">8</a></sup> should also be assessed at that point.</p></section></section>
