# Deploys are handled by Netlify (netlify.toml); this workflow only verifies.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NOMOSX_TEST_OFFLINE: '1'
  DATABASE_URL: postgresql://test:test@127.0.0.1:1/offline
  JWT_SECRET: ci-jwt-secret-with-at-least-32-characters-long

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # postinstall runs `prisma generate` — no separate step needed
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint (0 errors, warnings capped)
        run: npx eslint lib app components --cache --max-warnings 200

      - name: Unit tests
        run: npx jest __tests__/lib/agent __tests__/lib/worker lib/agent/__tests__ --runInBand --ci

      - name: Cassette fixture integrity
        run: npx tsx scripts/replay-run.ts --inspect .llm-cassettes/gulf-minerals.fixture.jsonl
