[build]
  command = "npm cache clean --force && npm install && npm run build"
  publish = ".next"
  functions = "netlify/functions"

# Externalize heavy packages not needed by Netlify functions.
# Without this, onnxruntime-node (210MB) + @sparticuz/chromium (58MB) + sharp (48MB)
# get bundled into ALL functions, pushing them over the 250MB Netlify limit.
# external_node_modules: don't bundle into JS but still include in zip
# included_files: explicitly exclude from the zip entirely
[functions]
  node_bundler = "esbuild"
  external_node_modules = [
    "@sparticuz/chromium",
    "puppeteer-core",
    "onnxruntime-node",
    "onnxruntime-web",
    "@huggingface/transformers",
    "sharp",
    "pdfjs-dist",
    "three",
    "three-stdlib",
    "@napi-rs/canvas",
    "@react-three",
    "hls.js",
    "@mediapipe",
    "stats-gl"
  ]
  included_files = [
    "!node_modules/@sparticuz/**",
    "!node_modules/puppeteer-core/**",
    "!node_modules/onnxruntime-node/**",
    "!node_modules/onnxruntime-web/**",
    "!node_modules/@huggingface/transformers/**",
    "!node_modules/sharp/**",
    "!node_modules/pdfjs-dist/**",
    "!node_modules/three/**",
    "!node_modules/three-stdlib/**",
    "!node_modules/@napi-rs/**",
    "!node_modules/@react-three/**",
    "!node_modules/hls.js/**",
    "!node_modules/@mediapipe/**",
    "!node_modules/stats-gl/**"
  ]

[build.environment]
  # Node.js 22.x LTS - aligns with React Three Fiber camera-controls dependency
  # Node.js 24+ causes "exports is not defined in ES module scope"
  # due to ESM/CJS detection changes in console-dim.external.js
  NODE_VERSION = "22.13.0"
  NPM_VERSION = "10"
  # Fix Sharp installation issues
  SHARP_IGNORE_GLOBALVIPS = "1"
  # Skip Sharp binary download for faster builds
  SHARP_GLOBAL_BASEDIR = "/opt/buildhome/.npm-global"
  
  # NOTE: All API keys and secrets should be set in Netlify UI
  # Site settings → Build & deploy → Environment → Environment variables
  # Required variables: DATABASE_URL, JWT_SECRET, ADMIN_KEY, CRON_SECRET, NEXT_PUBLIC_APP_URL
  # LLM: set DEEPSEEK_API_KEY (recommended) or QWEN_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY

# Note: @netlify/plugin-nextjs handles all routing automatically
# No manual redirects needed for Next.js SSR
# Security headers are set in middleware.ts (HSTS, CSP, Permissions-Policy, etc.)
# — no duplicate headers here to avoid conflicts

[dev]
  command = "npm run dev"
  port = 3000
  publish = ".next"
  functions = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ─── Scheduled Cron Jobs ────────────────────────────────────────────────────
# These call the Next.js API routes via Netlify Scheduled Functions.
# Authorization: Bearer $CRON_SECRET (set in Netlify UI env vars)

[functions."cron-newsletter"]
  schedule = "0 8 * * 1"   # Every Monday at 08:00 UTC

[functions."cron-editorial-plan"]
  schedule = "0 20 * * 0"  # Every Sunday at 20:00 UTC (before weekly pipeline)

[functions."cron-self-improve"]
  schedule = "0 3 * * *"   # Every day at 03:00 UTC (low-traffic window)

[functions."cron-generate-briefs"]
  schedule = "0 22 * * 0"  # Every Sunday at 22:00 UTC (after editorial plan)

[functions."cron-generate-briefs-midweek"]
  schedule = "0 12 * * 3"  # Every Wednesday at 12:00 UTC (mid-week catch-up)

[functions."cron-auto-scan"]
  schedule = "0 6,18 * * *"  # Twice daily at 06:00 and 18:00 UTC (intelligent vertical rotation + reactive publish)

[functions."cadence-reset"]
  schedule = "0 0 * * *"    # Daily at 00:00 UTC (reset expired counters)

[functions."cron-macro-refresh"]
  schedule = "0 5 * * 1"     # Every Monday at 05:00 UTC (refresh Eurostat/ECB/INSEE data)

# StudioX async pipeline — up to 15 min background execution
[functions."studiox-run-pipeline-background"]
  background = true

[functions."cron-studiox-drain"]
  schedule = "*/5 * * * *"   # Every 5 min — re-enqueue stuck PAID/QUEUED StudioX orders

[functions."cron-tweet-publications"]
  schedule = "23 */6 * * *"  # Every 6h — tweet newly published articles (no-ops without Twitter creds)
