# Railway deployment — durable pipeline worker.
#
# Deploy the web app from the main Dockerfile / Netlify as usual.
# Deploy THIS as a second Railway service pointing at the same repo
# with dockerfilePath = Dockerfile.worker.
#
# Required env vars (same project vars as the web app):
#   DATABASE_URL                 — Postgres (worker claims Jobs from it)
#   NEXT_PUBLIC_APP_URL          — for absolute links in publications
#   LLM provider keys            — ANTHROPIC_API_KEY, OPENAI_API_KEY, …
#   Search provider keys         — TAVILY_API_KEY, EXA_API_KEY, …
#   GROQ_API_KEY / CEREBRAS_API_KEY / NVIDIA_API_KEY / OPENROUTER_API_KEY
#                                — freepool last-resort cascade (S28b)
#   REDIS_URL (if configured)    — scout cache + rate limits
#
# Concurrency: run 1 replica. Job claiming is atomic so more replicas are
# safe, but a single 45–75min cycle is the design unit; scale vertically.

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile.worker"

[deploy]
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 5
  healthcheckPath = "/health"
  healthcheckTimeout = 10
