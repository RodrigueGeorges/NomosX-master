<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NomosX — Instagram Intro</title>
<style>
/* ── Reset ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --nx-text-primary: #0a0a0f;
  --nx-font-heading: 'Georgia', 'Times New Roman', serif;
  --font-mono: 'Courier New', monospace;
}

html, body {
  width: 100%;
  height: 100%;
  background: #1a1a1a;
  overflow: hidden;
  font-family: var(--nx-font-heading);
  -webkit-font-smoothing: antialiased;
}

/* ── Stage — 9:16 container centered on screen ────────────────────── */
.stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0a0a0a;
}

.phone {
  position: relative;
  width: min(100vw, calc(100vh * 9 / 16));
  height: min(100vh, calc(100vw * 16 / 9));
  background: #ffffff;
  overflow: hidden;
  cursor: pointer;
}

/* ── Overlay ───────────────────────────────────────────────────────── */
.nx-intro-overlay {
  position: absolute;
  inset: 0;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.nx-intro-overlay.nx-intro-exit {
  animation: nx-intro-exit 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  pointer-events: none;
}

@keyframes nx-intro-exit {
  0%   { opacity: 1; }
  100% { opacity: 0; }
}

/* Aurora */
.nx-intro-aurora {
  position: absolute;
  left: 50%;
  bottom: -8rem;
  transform: translateX(-50%);
  width: 140%;
  height: 40rem;
  pointer-events: none;
  background:
    radial-gradient(ellipse 40% 60% at 30% 100%, rgba(180, 200, 255, 0.05), transparent 60%),
    radial-gradient(ellipse 35% 55% at 70% 100%, rgba(129, 140, 248, 0.04), transparent 60%),
    radial-gradient(ellipse 50% 100% at 50% 100%, rgba(10, 10, 15, 0.03), transparent 65%);
  border-radius: 50% 50% 0 0;
  animation: nx-aurora 16s ease-in-out infinite;
  filter: blur(4px);
  z-index: 0;
}

@keyframes nx-aurora {
  0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.6; }
  50%      { transform: translateX(-50%) scale(1.05); opacity: 0.9; }
}

/* ── Floating Greek × Binary char grid ─────────────────────────────── */
.nx-intro-grid-container {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1);
}

.nx-intro-grid-active { opacity: 1; }
.nx-intro-grid-fading { opacity: 0; transition: opacity 1.5s ease; }

.nx-intro-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  grid-template-rows: repeat(16, 1fr);
  width: 100%;
  height: 100%;
  gap: 0;
}

.nx-intro-grid-char {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(0.9rem, 1.5vh, 1.5rem);
  font-weight: 400;
  transform: rotate(var(--rot, 0deg)) translate(var(--ox, 0px), var(--oy, 0px));
  will-change: transform, opacity;
  transition:
    transform 1.5s cubic-bezier(0.16, 1, 0.3, 1) var(--delay, 0s),
    opacity 1.2s ease var(--delay, 0s);
}

.nx-intro-grid-char-organized {
  transform: rotate(0deg) translate(0px, 0px) !important;
  opacity: 0.12 !important;
}

/* ── Phase label ───────────────────────────────────────────────────── */
.nx-intro-phase-label {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.5em;
  text-transform: uppercase;
  color: rgba(10, 10, 15, 0.25);
  margin: 0;
  opacity: 0;
  animation: nx-intro-fade-in 1.5s ease 1s forwards;
}

/* ── Scan line ─────────────────────────────────────────────────────── */
.nx-intro-scan-container {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 100%;
  pointer-events: none;
  z-index: 3;
}

.nx-intro-scan-line {
  position: absolute;
  left: 8%;
  right: 8%;
  top: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(10, 10, 15, 0.4), transparent);
  opacity: 0;
  animation: nx-intro-scan-descend 4s cubic-bezier(0.4, 0, 0.6, 1) 0.5s forwards;
}

@keyframes nx-intro-scan-descend {
  0%   { top: 0; opacity: 0; }
  8%   { opacity: 1; }
  92%  { opacity: 1; }
  100% { top: 100%; opacity: 0; }
}

.nx-intro-scan-glow {
  position: absolute;
  left: 8%;
  right: 8%;
  top: 0;
  height: 60px;
  background: linear-gradient(to bottom, rgba(10, 10, 15, 0.05), transparent);
  opacity: 0;
  animation: nx-intro-scan-glow-descend 4s cubic-bezier(0.4, 0, 0.6, 1) 0.5s forwards;
}

@keyframes nx-intro-scan-glow-descend {
  0%   { top: 0; opacity: 0; }
  8%   { opacity: 1; }
  92%  { opacity: 1; }
  100% { top: calc(100% - 60px); opacity: 0; }
}

/* ── Phase container ──────────────────────────────────────────────── */
.nx-intro-phase {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 1.5rem;
  opacity: 0;
  z-index: 2;
  transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
}

.nx-intro-phase-active { opacity: 1; }

/* ── Manifesto text block ──────────────────────────────────────────── */
.nx-intro-text-block {
  position: relative;
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 2rem 2rem;
  border-radius: 2px;
  max-width: 85%;
}

.nx-intro-manifesto {
  font-family: var(--nx-font-heading);
  font-weight: 500;
  font-size: clamp(0.95rem, 2.2vh, 1.4rem);
  line-height: 1.4;
  letter-spacing: -0.01em;
  color: var(--nx-text-primary);
  margin: 0;
  clip-path: inset(0 100% 0 0);
  animation: nx-intro-clip-reveal 2s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
}

@keyframes nx-intro-clip-reveal {
  to { clip-path: inset(0 0 0 0); }
}

/* ── Eyebrow ───────────────────────────────────────────────────────── */
.nx-intro-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(10, 10, 15, 0.45);
  margin-bottom: 1.5rem;
  opacity: 0;
  animation: nx-intro-fade-in 0.8s ease 0.3s forwards;
}

.nx-intro-eyebrow-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(10, 10, 15, 0.3);
  display: inline-block;
}

/* ── Wordmark ──────────────────────────────────────────────────────── */
.nx-intro-wordmark {
  font-family: var(--nx-font-heading);
  font-weight: 600;
  font-size: clamp(3rem, 12vh, 6rem);
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--nx-text-primary);
  margin: 0;
  animation: nx-intro-bloom 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  filter: blur(14px);
  opacity: 0;
}

@keyframes nx-intro-bloom {
  0%   { opacity: 0; filter: blur(14px); transform: scale(0.92); }
  50%  { opacity: 1; filter: blur(3px); transform: scale(1.02); }
  100% { opacity: 1; filter: blur(0); transform: scale(1); }
}

.nx-intro-x {
  position: relative;
  display: inline-block;
}

.nx-intro-x::after {
  content: '';
  position: absolute;
  left: -0.05em;
  right: -0.05em;
  bottom: 0.05em;
  height: 3px;
  background: linear-gradient(90deg, transparent, rgba(10, 10, 15, 0.5), transparent);
}

/* Meander */
.nx-intro-meander-mini {
  width: 140px;
  margin-top: 1.5rem;
  opacity: 0;
  animation: nx-intro-fade-in 0.8s ease 0.8s forwards;
}

.nx-intro-meander-mini path {
  stroke-dasharray: 400;
  stroke-dashoffset: 400;
  animation: nx-intro-meander-draw 2s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
}

@keyframes nx-intro-meander-draw {
  to { stroke-dashoffset: 0; }
}

.nx-intro-tagline {
  font-family: var(--nx-font-heading);
  font-weight: 500;
  font-size: clamp(1rem, 2.5vh, 1.5rem);
  letter-spacing: -0.01em;
  color: var(--nx-text-primary);
  margin-top: 1.2rem;
  opacity: 0;
  animation: nx-intro-fade-in 0.8s ease 1.2s forwards;
}

.nx-intro-subtitle {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(10, 10, 15, 0.45);
  margin-top: 0.8rem;
  opacity: 0;
  animation: nx-intro-fade-in 0.8s ease 1.6s forwards;
  max-width: 80%;
}

/* ── Progress bar ──────────────────────────────────────────────────── */
.nx-intro-progress {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: rgba(10, 10, 15, 0.04);
  z-index: 5;
}

.nx-intro-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, rgba(10, 10, 15, 0.3), rgba(10, 10, 15, 0.15));
  width: 0;
  animation: nx-intro-progress linear forwards;
}

@keyframes nx-intro-progress {
  from { width: 0; }
  to   { width: 100%; }
}

@keyframes nx-intro-fade-in {
  to { opacity: 1; }
}

/* ── Controls ──────────────────────────────────────────────────────── */
.controls {
  position: fixed;
  bottom: 1rem;
  right: 1rem;
  z-index: 10;
  display: flex;
  gap: 0.5rem;
}

.ctrl-btn {
  padding: 0.6rem 1rem;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.5);
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 2px;
  cursor: pointer;
  transition: color 0.3s, border-color 0.3s, background 0.3s;
}

.ctrl-btn:hover {
  color: rgba(255, 255, 255, 0.8);
  border-color: rgba(255, 255, 255, 0.3);
}

.ctrl-btn.recording {
  color: #ff4444;
  border-color: rgba(255, 68, 68, 0.4);
  background: rgba(255, 68, 68, 0.08);
}

/* Recording status overlay */
.rec-status {
  position: fixed;
  top: 1rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  padding: 0.5rem 1rem;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(0, 0, 0, 0.7);
  border-radius: 2px;
  display: none;
}

.rec-status.active { display: block; }

.rec-status .dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff4444;
  margin-right: 0.5rem;
  animation: rec-pulse 1s ease-in-out infinite;
}

@keyframes rec-pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.3; }
}
</style>
</head>
<body>

<div class="stage">
  <div class="phone" id="phone">
    <div class="nx-intro-overlay" id="overlay">
      <div class="nx-intro-aurora"></div>
      <div class="nx-intro-grid-container" id="grid-container">
        <div class="nx-intro-grid" id="grid"></div>
      </div>
      <!-- Phase 1: CHAOS -->
      <div class="nx-intro-phase" id="phase-chaos">
        <p class="nx-intro-phase-label">CHAOS</p>
      </div>
      <!-- Phase 2: SCAN -->
      <div class="nx-intro-phase" id="phase-scan">
        <div class="nx-intro-scan-container">
          <div class="nx-intro-scan-line"></div>
          <div class="nx-intro-scan-glow"></div>
        </div>
        <div class="nx-intro-text-block">
          <p class="nx-intro-manifesto" id="manifesto"></p>
        </div>
      </div>
      <!-- Phase 3: NOMOS -->
      <div class="nx-intro-phase" id="phase-nomos">
        <span class="nx-intro-eyebrow">
          <span class="nx-intro-eyebrow-dot"></span>
          The first AI think tank, always on
        </span>
        <h2 class="nx-intro-wordmark" id="wordmark">NOMOS<span class="nx-intro-x">X</span></h2>
        <svg class="nx-intro-meander-mini" viewBox="0 0 160 8" preserveAspectRatio="none">
          <path d="M0,4 L20,4 L20,1 L8,1 L8,7 L32,7 L32,0 L44,0 L44,4 L60,4 L60,1 L72,1 L72,7 L96,7 L96,0 L108,0 L108,4 L124,4 L124,1 L136,1 L136,7 L160,7" fill="none" stroke="rgba(10,10,15,0.3)" stroke-width="1" />
        </svg>
        <p class="nx-intro-tagline">From Chaos to Nomos.</p>
        <p class="nx-intro-subtitle">An AI think tank that publishes positions, not opinions.</p>
      </div>
      <!-- Progress bar -->
      <div class="nx-intro-progress">
        <div class="nx-intro-progress-bar" id="progress-bar" style="animation-duration: 15000ms;"></div>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="ctrl-btn" id="record-btn" onclick="recordVideo()">● Record Video</button>
  <button class="ctrl-btn" onclick="start()">↻ Replay</button>
</div>
<div class="rec-status" id="rec-status"><span class="dot"></span>Recording… <span id="rec-timer">0s</span></div>

<script>
const CHAOS_MS = 5000;
const SCAN_MS = 5000;
const NOMOS_MS = 5000;
const TOTAL_MS = CHAOS_MS + SCAN_MS + NOMOS_MS;

const GREEK_CHARS = "ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩαβγδεζηθικλμνξοπρστυφχψω";
const BINARY_CHARS = "01";
const SCRAMBLE_CHARS = "ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ0123456789@#$%&*<>{}[]/\\|";

const COLS = 10;
const ROWS = 16;

let timers = [];
let completed = false;

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const isGreek = Math.random() > 0.4;
      const pool = isGreek ? GREEK_CHARS : BINARY_CHARS;
      const char = pool[Math.floor(Math.random() * pool.length)];
      const span = document.createElement('span');
      span.className = 'nx-intro-grid-char';
      const rot = (Math.random() - 0.5) * 60;
      const ox = (Math.random() - 0.5) * 20;
      const oy = (Math.random() - 0.5) * 20;
      const delay = (r * 0.12).toFixed(2);
      const opacity = (0.03 + Math.random() * 0.05).toFixed(3);
      span.style.setProperty('--rot', rot + 'deg');
      span.style.setProperty('--ox', ox + 'px');
      span.style.setProperty('--oy', oy + 'px');
      span.style.setProperty('--delay', delay + 's');
      span.style.opacity = opacity;
      span.style.color = isGreek ? '#0a0a0f' : 'rgba(10,10,15,0.5)';
      span.style.fontFamily = isGreek ? 'Georgia, serif' : 'Courier New, monospace';
      span.textContent = char;
      grid.appendChild(span);
    }
  }
}

function scrambleText(target, el, durationMs) {
  const chars = target.split('');
  const resolveTimes = chars.map((_, i) => {
    const base = (i / chars.length) * durationMs * 0.6;
    const jitter = Math.random() * durationMs * 0.4;
    return base + jitter;
  });
  const start = performance.now();
  function tick(now) {
    const elapsed = now - start;
    let done = true;
    const out = chars.map((ch, i) => {
      if (ch === ' ' || ch === '.' || ch === "'" || ch === '-' || ch === ',') return ch;
      if (elapsed >= resolveTimes[i]) return ch;
      done = false;
      return SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];
    });
    el.textContent = out.join('');
    if (!done) requestAnimationFrame(tick);
    else el.textContent = target;
  }
  requestAnimationFrame(tick);
}

function clearTimers() {
  timers.forEach(t => clearTimeout(t));
  timers = [];
}

function setPhase(phase) {
  document.getElementById('phase-chaos').classList.toggle('nx-intro-phase-active', phase === 'chaos');
  document.getElementById('phase-scan').classList.toggle('nx-intro-phase-active', phase === 'scan');
  document.getElementById('phase-nomos').classList.toggle('nx-intro-phase-active', phase === 'nomos' || phase === 'exit');
}

function start() {
  clearTimers();
  completed = false;
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('nx-intro-exit');

  // Reset grid
  buildGrid();
  const gridContainer = document.getElementById('grid-container');
  gridContainer.classList.add('nx-intro-grid-active');
  gridContainer.classList.remove('nx-intro-grid-fading');

  // Reset organized chars
  document.querySelectorAll('.nx-intro-grid-char').forEach(el => {
    el.classList.remove('nx-intro-grid-char-organized');
  });

  // Reset progress bar
  const bar = document.getElementById('progress-bar');
  bar.style.animation = 'none';
  void bar.offsetWidth;
  bar.style.animation = `nx-intro-progress ${TOTAL_MS}ms linear forwards`;

  // Phase 1: CHAOS
  setPhase('chaos');

  // Phase 2: SCAN (after 5s)
  timers.push(setTimeout(() => {
    setPhase('scan');
    // Organize grid chars
    document.querySelectorAll('.nx-intro-grid-char').forEach(el => {
      el.classList.add('nx-intro-grid-char-organized');
    });
    // Scramble manifesto
    scrambleText(
      "The world doesn't suffer from a lack of information. It suffers from a lack of structure.",
      document.getElementById('manifesto'),
      3000
    );
  }, CHAOS_MS));

  // Phase 3: NOMOS (after 10s)
  timers.push(setTimeout(() => {
    setPhase('nomos');
    gridContainer.classList.add('nx-intro-grid-fading');
    gridContainer.classList.remove('nx-intro-grid-active');
    // Scramble wordmark
    scrambleText('NOMOS', document.getElementById('wordmark'), 1500);
    // Re-add X span after scramble
    setTimeout(() => {
      const wm = document.getElementById('wordmark');
      if (!wm.querySelector('.nx-intro-x')) {
        wm.innerHTML = wm.textContent + '<span class="nx-intro-x">X</span>';
      }
    }, 1600);
  }, CHAOS_MS + SCAN_MS));

  // Exit (after 15s)
  timers.push(setTimeout(() => {
    if (completed) return;
    completed = true;
    overlay.classList.add('nx-intro-exit');
  }, TOTAL_MS));

  // Safety
  timers.push(setTimeout(() => {
    if (!completed) {
      completed = true;
      overlay.classList.add('nx-intro-exit');
    }
  }, TOTAL_MS + 5000));
}

// ── Video recording ──────────────────────────────────────────────────
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;
let recTimerInterval = null;

async function recordVideo() {
  const btn = document.getElementById('record-btn');

  if (isRecording) return;

  // Try canvas capture first (cleanest)
  const phone = document.getElementById('phone');

  try {
    // Use getDisplayMedia for screen capture
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 30 },
      audio: false,
    });

    // Setup recorder
    recordedChunks = [];
    const mimeType = 'video/webm;codecs=vp9';
    mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8000000 });

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      // Create download link
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'nomosx-intro-instagram.webm';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      // Reset UI
      isRecording = false;
      btn.classList.remove('recording');
      btn.textContent = '● Record Video';
      document.getElementById('rec-status').classList.remove('active');
      clearInterval(recTimerInterval);
      stream.getTracks().forEach(t => t.stop());
    };

    // Start recording + animation
    isRecording = true;
    btn.classList.add('recording');
    btn.textContent = '● Recording…';
    document.getElementById('rec-status').classList.add('active');

    mediaRecorder.start();
    start();

    // Timer
    let recSec = 0;
    document.getElementById('rec-timer').textContent = '0s';
    recTimerInterval = setInterval(() => {
      recSec++;
      document.getElementById('rec-timer').textContent = recSec + 's';
    }, 1000);

    // Stop after animation + exit (16s + 1s buffer)
    setTimeout(() => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }, TOTAL_MS + 2000);

    // Stop if user stops sharing
    stream.getVideoTracks()[0].onended = () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    };

  } catch (err) {
    alert('Screen capture needed to record. Please allow screen sharing and select this tab.\\n\\nError: ' + err.message);
  }
}

// Auto-start
window.addEventListener('load', start);

// Click to replay (not during recording)
document.getElementById('overlay').addEventListener('click', () => {
  if (!isRecording) start();
});
</script>

</body>
</html>
